<title>Orbis System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Orbis System — тем две, и обе настоящие: сотрудник переключает их
     в меню профиля. Ниже светлая (по умолчанию), тёмная переопределяет
     те же переменные в :root[data-theme="dark"]. */
  :root {
    --canvas: #eef1f6;
    --surface-1: #ffffff;
    --surface-2: #f5f7fa;
    --surface-3: #e9edf3;
    --hairline: #d7dee8;
    --hairline-soft: #e6eaf1;
    --ink: #16202b;
    --ink-muted: #5b6b7c;
    --ink-faint: #8a98a8;
    --accent: #0a6ed1;
    --deal: #159556;
    --progress: #c08a12;
    --risk: #d92f52;
    --new: #ea6a1e;
    --violet: #5a3fdc;
    --magenta: #b62fcb;
    --hold: #78879a;
    --rail-bg: #ffffff;
    --topbar-bg: rgb(255 255 255 / .86);
    --scrim: rgb(16 24 40 / .38);
    --thumb: #c6cfdb;
    --shadow-card: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .04);
    --shadow-raised: 0 8px 24px rgb(16 24 40 / .1), 0 2px 6px rgb(16 24 40 / .05);
    --edge-top: inset 0 1px 0 0 rgb(255 255 255 / .6);
    --rail: 244px;
    color-scheme: light;
  }

  /* Справочники приходят из кода продукта и называют цвета по-своему.
     Один алиас — и прототип красит статусы теми же токенами. */
  :root, :root[data-theme="dark"] {
    --color-status-new: var(--new);
    --color-status-open: var(--accent);
    --color-status-progress: var(--progress);
    --color-status-deal: var(--deal);
    --color-status-hold: var(--hold);
    --color-status-risk: var(--risk);
    --color-status-violet: var(--violet);
    --color-status-magenta: var(--magenta);
    --color-ink-faint: var(--ink-faint);
    --color-accent: var(--accent);
  }

  /* Тёмная — не инверсия светлой: там иерархия набирается подъёмом
     поверхности, а не тенью, поэтому тени почти исчезают. */
  :root[data-theme="dark"] {
    --canvas: #0b0b0d;
    --surface-1: #16171a;
    --surface-2: #1e2024;
    --surface-3: #26292e;
    --hairline: #2e3138;
    --hairline-soft: #212429;
    --ink: #f2f4f7;
    --ink-muted: #9aa4b2;
    --ink-faint: #6b7580;
    --accent: #3b9dff;
    --deal: #2bc46c;
    --progress: #e0b341;
    --risk: #ff5577;
    --new: #ff7a3d;
    --violet: #7c60ff;
    --magenta: #d44df0;
    --hold: #8a8a8a;
    --rail-bg: #111214;
    --topbar-bg: rgb(11 11 13 / .88);
    --scrim: rgb(0 0 0 / .72);
    --thumb: #2a2d33;
    --shadow-card: 0 1px 2px rgb(0 0 0 / .4);
    --shadow-raised: 0 12px 34px rgb(0 0 0 / .45);
    --edge-top: inset 0 1px 0 0 rgb(255 255 255 / .05);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.3;
    letter-spacing: -0.15px;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv01", "cv05", "cv09", "cv11";
  }

  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
  ::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  :focus-visible { outline: none; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); border-radius: 8px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--thumb); border: 3px solid var(--canvas); border-radius: 100px; }

  /* ── типографика ─────────────────────────────────────────── */
  .t-display { font-size: 32px; font-weight: 500; line-height: 1.13; letter-spacing: -1.4px; margin: 0; }
  .t-display-sm { font-size: 26px; font-weight: 500; line-height: 1.15; letter-spacing: -1.1px; }
  .t-headline { font-size: 21px; font-weight: 600; line-height: 1.2; letter-spacing: -0.8px; margin: 0; }
  .t-body-sm { font-size: 14px; font-weight: 500; line-height: 1.4; letter-spacing: -0.14px; }
  .t-caption { font-size: 13px; font-weight: 500; line-height: 1.2; letter-spacing: -0.13px; }
  .t-micro { font-size: 12px; line-height: 1.25; letter-spacing: -0.12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-muted); }
  .faint { color: var(--ink-faint); }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nowrap { white-space: nowrap; }

  /* ── поверхности ─────────────────────────────────────────── */
  /* Блок обязан отличаться от блока: поверхность + волосяная граница +
     тень + подсветка верхней грани. Трёх признаков разом хватает глазу. */
  .card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 15px; box-shadow: var(--shadow-card), var(--edge-top); }
  .card-head { background: var(--surface-2); border-bottom: 1px solid var(--hairline-soft); border-radius: 15px 15px 0 0; padding: 12px 16px; }
  .card-hover { transition: background-color .14s ease, border-color .14s ease, box-shadow .14s ease; }
  .card-hover:hover { background: var(--surface-2); border-color: var(--hairline); box-shadow: var(--shadow-raised), var(--edge-top); }
  .divide > * + * { border-top: 1px solid var(--hairline-soft); }

  /* ── кнопки ──────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 13px; font-weight: 500; line-height: 1; letter-spacing: -0.14px;
    border: 1px solid transparent; border-radius: 100px; padding: 9px 14px;
    cursor: pointer; white-space: nowrap;
    transition: background-color .14s ease, transform .12s ease, border-color .14s ease;
  }
  .btn:active { transform: scale(.975); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--surface-1); border-color: var(--hairline); box-shadow: var(--shadow-card); }
  .btn-secondary:hover { background: var(--surface-2); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 999px; border: none;
    background: transparent; color: var(--ink-muted); cursor: pointer;
    transition: background-color .14s ease, color .14s ease;
  }
  .icon-btn:hover { background: var(--surface-1); color: var(--ink); }

  /* ── чипы, поля, точки ───────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 100px;
    background: var(--surface-1); border: 1px solid var(--hairline-soft);
    color: var(--ink-muted); font-size: 12px; font-weight: 500; letter-spacing: -.12px;
    white-space: nowrap; cursor: default;
  }
  button.chip { cursor: pointer; transition: background-color .14s ease, color .14s ease, border-color .14s ease; }
  button.chip:hover { border-color: var(--hairline); color: var(--ink); }
  .chip.on { background: color-mix(in srgb, var(--accent) 12%, var(--surface-1)); border-color: color-mix(in srgb, var(--accent) 38%, transparent); color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; display: inline-block; }
  .field {
    background: var(--surface-1); border: 1px solid var(--hairline-soft);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; width: 100%;
  }
  select.field { cursor: pointer; }
  .pill-field { border-radius: 100px; padding: 6px 12px; width: auto; font-size: 12px; }
  .progress { display: block; height: 3px; width: 100%; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; border-radius: 999px; }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    border-radius: 999px; background: var(--surface-2); border: 1px solid var(--hairline);
    color: var(--ink-muted); font-weight: 500; letter-spacing: -.02em;
  }

  /* ── каркас ──────────────────────────────────────────────── */
  .shell { display: flex; min-height: 100vh; }
  .rail {
    position: sticky; top: 0; align-self: flex-start; height: 100vh;
    width: var(--rail); flex: none; display: flex; flex-direction: column;
    padding: 20px 16px; border-right: 1px solid var(--hairline); background: var(--rail-bg);
    overflow-y: auto; overflow-x: hidden;
    transition: width .16s ease, padding .16s ease;
  }
  /* Свёрнутая рельса: только иконки — на ноутбуке это лишние 170px под доску. */
  .rail.narrow { width: 72px; padding-inline: 12px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px;
    border-bottom: 1px solid var(--hairline-soft);
    background: var(--topbar-bg); backdrop-filter: blur(16px);
  }
  .content { padding: 26px 20px 60px; min-width: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    color: var(--ink-muted); font-size: 14px; font-weight: 500; letter-spacing: -.14px;
    transition: background-color .14s ease, color .14s ease; cursor: pointer;
  }
  .nav-item:hover { background: var(--surface-1); color: var(--ink); }
  .nav-item.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .nav-group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); padding: 0 12px; margin-bottom: 8px; }

  .grid { display: grid; gap: 16px; }
  .section-title:not(:first-child) { margin-top: 34px !important; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-muted); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .scroll-x { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); padding: 12px 16px; white-space: nowrap; }
  td { padding: 13px 16px; border-top: 1px solid var(--hairline-soft); vertical-align: middle; }
  tbody tr { transition: background-color .14s ease; }
  tbody tr:hover { background: var(--surface-2); }

  .spotlight {
    border-radius: 30px; padding: 30px;
    background: radial-gradient(120% 120% at 0% 0%, #8a6cff 0%, transparent 55%), linear-gradient(135deg, #6a4cf5 0%, #d44df0 100%);
  }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 10px; background: var(--surface-1); border: 1px solid rgb(224 179 65 / .25); color: var(--ink-muted); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--hairline-soft); margin-bottom: 12px; }
  .board { display: flex; gap: 16px; min-width: max-content; padding-bottom: 8px; }
  .board-col { width: 280px; flex: none; display: flex; flex-direction: column; gap: 12px; }
  .empty-col { border: 1px dashed var(--hairline); border-radius: 15px; padding: 26px; text-align: center; color: var(--ink-faint); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 18px; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--hairline-soft); }
  .kv:last-child { border-bottom: 0; }
  .menu-toggle { display: none; }
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 49; }

  /* ── канбан ──────────────────────────────────────────────── */
  .kan { display: flex; gap: 12px; min-width: max-content; padding-bottom: 8px; align-items: flex-start; }
  .kan-col {
    width: 264px; flex: none; display: flex; flex-direction: column; gap: 8px;
    border: 1px solid transparent; border-radius: 12px; padding: 8px;
    transition: border-color .14s ease, background-color .14s ease;
  }
  .kan-col.over { border-color: var(--accent); background: var(--surface-1); }
  .kan-head { padding: 4px 6px 8px; }
  .kan-rule { height: 2px; border-radius: 999px; margin-top: 8px; }
  .kan-card { position: relative; display: block; padding: 10px 12px; cursor: grab; }
  .kan-card.drag { opacity: .4; }
  .kan-flag { position: absolute; left: 0; top: 12px; width: 2px; height: 24px; border-radius: 0 999px 999px 0; }

  /* ── полоса стадий в карточке ────────────────────────────── */
  .stages { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .stage-btn {
    border: 0; border-radius: 6px; padding: 7px 10px; font-size: 12px; white-space: nowrap;
    cursor: pointer; transition: opacity .14s ease;
  }

  /* ── история ─────────────────────────────────────────────── */
  .tl { position: relative; border-left: 1px solid var(--hairline-soft); padding-left: 16px; margin: 0; list-style: none; }
  .tl > li + li { margin-top: 16px; }
  .tl-dot { position: absolute; left: -21px; top: 6px; width: 8px; height: 8px; border-radius: 999px; box-shadow: 0 0 0 4px var(--surface-1); }

  /* ── свои списки и календарь ─────────────────────────────── */
  .pop {
    position: absolute; z-index: 60; min-width: 220px; max-width: min(360px, 90vw);
    max-height: 300px; overflow-y: auto;
    background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 15px;
    box-shadow: var(--shadow-raised), var(--edge-top); padding: 4px 0;
  }
  .pop button {
    display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px;
    background: none; border: 0; text-align: left; cursor: pointer; color: inherit; font-size: 13px;
  }
  .pop button:hover { background: var(--surface-2); }
  .select {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
    border-radius: 100px; background: var(--surface-1); border: 1px solid var(--hairline-soft);
    font-size: 12px; cursor: pointer; color: inherit; max-width: 100%;
  }
  .select:hover { border-color: var(--hairline); }
  .swatch { width: 24px; height: 24px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; padding: 0; }
  .check {
    width: 18px; height: 18px; flex: none; border-radius: 5px; border: 1px solid var(--hairline);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .modal-scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 15px; padding: 22px; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-raised); }

  /* ── умный фильтр ────────────────────────────────────────── */
  .filter { margin-bottom: 18px; }
  .filter-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 100px; padding: 6px 8px 6px 14px; box-shadow: var(--shadow-card), var(--edge-top);
  }
  /* Поле не сжимается до нечитаемого огрызка: «Поиск и ф…» — это ошибка,
     а не компактность. Если места мало, строка переносится. */
  .filter-bar input {
    flex: 1 1 220px; min-width: 200px; background: none; border: 0; outline: none;
    font-size: 13px; color: var(--ink); padding: 6px 0;
  }
  .filter-bar input::placeholder { color: var(--ink-faint); }
  .filter-panel {
    display: grid; grid-template-columns: 210px 1fr; gap: 0;
    margin-top: 10px; background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-raised), var(--edge-top);
  }
  .filter-presets { background: var(--surface-2); border-right: 1px solid var(--hairline-soft); padding: 12px 10px; }
  .filter-preset {
    display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px;
    border: 0; border-radius: 8px; background: none; color: var(--ink-muted);
    font-size: 13px; text-align: left; cursor: pointer;
  }
  .filter-preset:hover { background: var(--surface-1); color: var(--ink); }
  .filter-preset.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .filter-fields { padding: 16px; display: grid; gap: 12px; }
  .filter-field { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; }
  .filter-field > label { font-size: 12px; color: var(--ink-muted); }
  .filter-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--hairline-soft); grid-column: 1 / -1; }
  .chip-x { border: 0; background: none; color: inherit; cursor: pointer; opacity: .6; padding: 0; display: inline-flex; }
  .chip-x:hover { opacity: 1; }

  /* ── плашка рабочего дня ─────────────────────────────────── */
  .workday {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    border-radius: 100px; border: 1px solid var(--hairline); background: var(--surface-1);
    font-size: 12px; cursor: pointer; box-shadow: var(--shadow-card);
  }
  .workday.live { border-color: color-mix(in srgb, var(--deal) 45%, transparent); }
  .live-dot { position: relative; width: 7px; height: 7px; border-radius: 999px; background: var(--deal); flex: none; }
  .live-dot::after {
    content: ""; position: absolute; inset: -3px; border-radius: 999px;
    border: 1px solid var(--deal); opacity: .5; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  .clock { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -.02em; }

  /* ── календарь ───────────────────────────────────────────── */
  .cal-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--hairline-soft); border: 1px solid var(--hairline); border-radius: 15px; overflow: hidden; }
  .cal-dow { background: var(--surface-2); padding: 9px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); }
  .cal-day { background: var(--surface-1); min-height: 104px; padding: 8px; text-align: left; border: 0; cursor: pointer; display: flex; flex-direction: column; gap: 5px; color: inherit; }
  .cal-day:hover { background: var(--surface-2); }
  .cal-day.out { color: var(--ink-faint); background: var(--canvas); }
  .cal-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
  /* сегодняшнее число — заливкой, а не рамкой: его видно боковым зрением */
  .cal-day.today .cal-num { background: var(--accent); color: #fff; font-weight: 600; }
  .cal-ev { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hours { position: relative; display: grid; grid-template-columns: 56px 1fr; }
  .hour-label { height: 52px; font-size: 11px; color: var(--ink-faint); padding-right: 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .hour-slot { height: 52px; border-top: 1px solid var(--hairline-soft); position: relative; }
  .now-line { position: absolute; left: 56px; right: 0; height: 0; border-top: 2px solid var(--risk); z-index: 5; pointer-events: none; }
  .now-line::before { content: ""; position: absolute; left: -4px; top: -4px; width: 7px; height: 7px; border-radius: 999px; background: var(--risk); }
  .now-badge { position: absolute; left: 0; top: -9px; transform: translateX(-100%); margin-left: -6px; background: var(--risk); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .ev-card { position: absolute; left: 6px; right: 6px; border-radius: 8px; padding: 5px 8px; font-size: 11px; overflow: hidden; border-left: 3px solid; }

  /* ── структура компании ──────────────────────────────────── */
  .tree { display: flex; flex-direction: column; align-items: center; }
  .tree-node { display: flex; flex-direction: column; align-items: center; position: relative; }
  .tree-box { width: 210px; }
  .tree-stem { width: 1px; height: 18px; background: var(--hairline); }
  .tree-children { display: flex; justify-content: center; gap: 18px; }
  .tree-child { position: relative; padding-top: 18px; }
  /* связи рисуются границами, а не SVG: ни одной координаты вручную */
  .tree-child::before { content: ""; position: absolute; top: 0; left: 50%; width: 50%; height: 1px; background: var(--hairline); }
  .tree-child::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 1px; background: var(--hairline); }
